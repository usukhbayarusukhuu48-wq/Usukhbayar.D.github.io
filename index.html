<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <title>Usukhbayar's Portfolio</title>
  <style>
    body { 
      font-family: "Arial", sans-serif;
      line-height: 1.6;
      max-width: 900px;
      margin: 50px auto;
      background-color: #f0f9f0;
      color: #333;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      transition: all 0.5s ease;
      position: relative;
    }

    /* Хэл сонголтын товч */
    .language-switcher {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 10px;
      z-index: 1000;
    }
    
    .lang-btn {
      padding: 8px 15px;
      border: 2px solid #1f3c88;
      background: white;
      color: #1f3c88;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    
    .lang-btn:hover {
      background: #1f3c88;
      color: white;
      transform: translateY(-2px);
    }
    
    .lang-btn.active {
      background: #1f3c88;
      color: white;
    }

    /* Фон өнгө сонгох товчнууд */
    .color-picker {
      position: absolute;
      top: 20px;
      right: 20px;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      z-index: 1000;
      max-width: 200px;
    }
    
    .color-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    
    .color-btn {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      border: 2px solid white;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    .color-btn:hover {
      transform: scale(1.2);
    }
    
    .color-label {
      font-size: 11px;
      text-align: center;
      margin-top: 3px;
    }

    h1 { 
      color: #1f3c88; 
      font-size: 40px; 
      text-align: center;
      margin-bottom: 10px;
      border-bottom: 3px solid #1f3c88;
      padding-bottom: 15px;
      margin-top: 60px;
    }
    
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 18px;
      margin-bottom: 30px;
      font-style: italic;
    }
    
    .section {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 25px;
      margin-bottom: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: background-color 0.5s ease;
    }
    
    .gradient-mode .section {
      background-color: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      color: #ffffff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }
    
    h2 {
      color: #1f3c88;
      border-left: 5px solid #1f3c88;
      padding-left: 15px;
      margin-top: 0;
    }
    
    .gradient-mode h2 {
      color: #ffffff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    }
    
    .profile-img {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 25px;
      border: 5px solid #1f3c88;
      box-shadow: 0 5px 15px rgba(31, 60, 136, 0.3);
    }
    
    .contact-info {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    
    .contact-item {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      width: 48%;
      text-decoration: none;
      color: #333;
      transition: all 0.3s ease;
    }
    
    .gradient-mode .contact-item {
      color: #ffffff;
    }
    
    .contact-item:hover {
      transform: translateY(-3px);
      color: #1f3c88;
    }
    
    .gradient-mode .contact-item:hover {
      color: #ffffff;
      opacity: 0.9;
    }
    
    .contact-icon {
      width: 24px;
      height: 24px;
      margin-right: 10px;
      color: #1f3c88;
    }
    
    .gradient-mode .contact-icon {
      color: #ffffff;
    }
    
    .social-icons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }
    
    .gradient-mode .social-icons {
      border-top: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    .social-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #333;
      transition: all 0.3s ease;
      padding: 10px;
      border-radius: 10px;
      background: #f8f9fa;
    }
    
    .gradient-mode .social-icon {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }
    
    .social-icon:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    
    .social-icon svg {
      width: 40px;
      height: 40px;
      margin-bottom: 8px;
    }
    
    .social-label {
      font-size: 14px;
      font-weight: 500;
    }
    
    .skills-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }
    
    .skill {
      background-color: #e6eeff;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 14px;
      color: #1f3c88;
      border: 1px solid #b8cbfa;
      transition: all 0.3s ease;
    }
    
    .gradient-mode .skill {
      background-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
    }
    
    .skill:hover {
      background-color: #1f3c88;
      color: white;
      transform: translateY(-2px);
    }
    
    .gradient-mode .skill:hover {
      background-color: rgba(255, 255, 255, 0.3);
    }
    
    .timeline {
      position: relative;
      padding-left: 30px;
      margin-top: 20px;
    }
    
    .timeline-item {
      position: relative;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px dashed #ddd;
    }
    
    .gradient-mode .timeline-item {
      border-bottom: 1px dashed rgba(255, 255, 255, 0.3);
    }
    
    .timeline-item:before {
      content: "";
      position: absolute;
      left: -30px;
      top: 5px;
      width: 15px;
      height: 15px;
      background-color: #1f3c88;
      border-radius: 50%;
    }
    
    .gradient-mode .timeline-item:before {
      background-color: #ffffff;
    }
    
    .year {
      color: #1f3c88;
      font-weight: bold;
      display: inline-block;
      margin-right: 10px;
    }
    
    .gradient-mode .year {
      color: #ffffff;
    }
    
    .footer {
      text-align: center;
      margin-top: 40px;
      color: #666;
      font-size: 14px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }
    
    .gradient-mode .footer {
      color: #ffffff;
      border-top: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    /* Welcome мэссэж */
    .welcome-message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      z-index: 2000;
      text-align: center;
      max-width: 400px;
      display: none;
    }
    
    .welcome-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }
    
    @media (max-width: 768px) {
      body {
        margin: 20px auto;
        padding: 20px;
      }
      
      .language-switcher {
        position: static;
        justify-content: center;
        margin-bottom: 20px;
      }
      
      .color-picker {
        position: static;
        margin: 20px auto;
        max-width: 300px;
      }
      
      .contact-item {
        width: 100%;
      }
      
      .social-icons {
        flex-wrap: wrap;
      }
      
      h1 {
        font-size: 32px;
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>
  <!-- Хэл сонголт -->
  <div class="language-switcher">
    <button class="lang-btn active" onclick="switchLanguage('mn')">🇲🇳 Монгол</button>
    <button class="lang-btn" onclick="switchLanguage('en')">🇺🇸 English</button>
  </div>

  <!-- Фон өнгө сонгох хэсэг -->
  <div class="color-picker">
    <strong style="color: #1f3c88;">🎨 Фон өнгө:</strong>
    <div class="color-options">
      <div>
        <div class="color-btn" style="background-color: #f0f4f8;" onclick="changeBackgroundColor('#f0f4f8', '#333')"></div>
        <div class="color-label">Цэнхэр</div>
      </div>
      <div>
        <div class="color-btn" style="background-color: #f8fafc;" onclick="changeBackgroundColor('#f8fafc', '#333')"></div>
        <div class="color-label">Цагаан</div>
      </div>
      <div>
        <div class="color-btn" style="background-color: #f0f9f0;" onclick="changeBackgroundColor('#f0f9f0', '#333')"></div>
        <div class="color-label">Ногоон</div>
      </div>
      <div>
        <div class="color-btn" style="background-color: #fffaf0;" onclick="changeBackgroundColor('#fffaf0', '#333')"></div>
        <div class="color-label">Шаргал</div>
      </div>
      <div>
        <div class="color-btn" style="background-color: #fdf2f8;" onclick="changeBackgroundColor('#fdf2f8', '#333')"></div>
        <div class="color-label">Ягаан</div>
      </div>
      <div>
        <div class="color-btn" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);" onclick="changeBackgroundGradient('#667eea', '#764ba2')"></div>
        <div class="color-label">Gradient 1</div>
      </div>
      <div>
        <div class="color-btn" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);" onclick="changeBackgroundGradient('#43e97b', '#38f9d7')"></div>
        <div class="color-label">Gradient 2</div>
      </div>
    </div>
  </div>

  <!-- Welcome мэссэж -->
  <div id="welcomeMessage" class="welcome-message">
    <h3 style="color: #1f3c88;">Welcome to my portfolio!</h3>
    <p>Please select your preferred language:</p>
    <div class="welcome-buttons">
      <button class="lang-btn active" onclick="selectLanguage('mn')" style="padding: 10px 20px;">🇲🇳 Монгол</button>
      <button class="lang-btn" onclick="selectLanguage('en')" style="padding: 10px 20px;">🇺🇸 English</button>
    </div>
  </div>

  <!-- Монгол хэлний контент -->
  <div id="content-mn">
    <!-- Контентыг энд оруулна (өмнөх кодтой ижил) -->
  </div>

  <!-- Англи хэлний контент -->
  <div id="content-en" style="display: none;">
    <!-- Контентыг энд оруулна (өмнөх кодтой ижил) -->
  </div>

  <script>
    // Welcome мэссэж харуулах (зөвхөн анх удаа)
    document.addEventListener('DOMContentLoaded', function() {
      const hasVisited = localStorage.getItem('hasVisited');
      
      if (!hasVisited) {
        document.getElementById('welcomeMessage').style.display = 'block';
      } else {
        // Өмнө сонгосон хэлийг сэргээх
        const savedLang = localStorage.getItem('selectedLanguage') || 'mn';
        switchLanguage(savedLang, true);
        
        // Өмнө сонгосон фоныг сэргээх
        const savedBgColor = localStorage.getItem('bgColor');
        const savedBgGradient = localStorage.getItem('bgGradient');
        const savedTextColor = localStorage.getItem('textColor');
        
        if (savedBgGradient) {
          // Gradient фон сэргээх
          document.body.style.background = savedBgGradient;
          document.body.classList.add('gradient-mode');
          document.body.style.color = savedTextColor || '#ffffff';
        } else if (savedBgColor) {
          // Энгийн фон сэргээх
          document.body.style.background = savedBgColor;
          document.body.classList.remove('gradient-mode');
          document.body.style.color = savedTextColor || '#333';
        }
      }
    });
    
    // Хэл сонгох (welcome мэссэжээс)
    function selectLanguage(lang) {
      localStorage.setItem('selectedLanguage', lang);
      localStorage.setItem('hasVisited', 'true');
      document.getElementById('welcomeMessage').style.display = 'none';
      switchLanguage(lang, true);
    }
    
    // Хэл солих функц
    function switchLanguage(lang, initial = false) {
      // Товчнуудыг актив болгох
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      
      if (lang === 'mn') {
        document.querySelector('.lang-btn[onclick*="mn"]').classList.add('active');
        document.getElementById('content-mn').style.display = 'block';
        document.getElementById('content-en').style.display = 'none';
        document.title = 'Өсөхбаярын танилцуулга';
        
        if (!initial) {
          localStorage.setItem('selectedLanguage', 'mn');
          showNotification('Хэл Монгол боллоо!');
        }
      } else {
        document.querySelector('.lang-btn[onclick*="en"]').classList.add('active');
        document.getElementById('content-mn').style.display = 'none';
        document.getElementById('content-en').style.display = 'block';
        document.title = 'Usukhbayar\'s Portfolio';
        
        if (!initial) {
          localStorage.setItem('selectedLanguage', 'en');
          showNotification('Language changed to English!');
        }
      }
    }
    
    // Фон өнгө өөрчлөх функц
    function changeBackgroundColor(color, textColor) {
      document.body.style.background = color;
      document.body.style.color = textColor;
      document.body.style.backgroundImage = 'none';
      document.body.classList.remove('gradient-mode');
      
      localStorage.setItem('bgColor', color);
      localStorage.setItem('textColor', textColor);
      localStorage.removeItem('bgGradient');
      localStorage.removeItem('bgColor1');
      localStorage.removeItem('bgColor2');
      
      showNotification('Фон өнгө өөрчлөгдлөө!');
    }
    
    // Gradient фон өөрчлөх
    function changeBackgroundGradient(color1, color2) {
      const gradient = `linear-gradient(135deg, ${color1} 0%, ${color2} 100%)`;
      document.body.style.background = gradient;
      document.body.style.backgroundImage = 'none';
      document.body.style.color = '#ffffff';
      document.body.classList.add('gradient-mode');
      
      localStorage.setItem('bgGradient', gradient);
      localStorage.setItem('bgColor1', color1);
      localStorage.setItem('bgColor2', color2);
      localStorage.removeItem('bgColor');
      localStorage.setItem('textColor', '#ffffff');
      
      showNotification('Gradient фон сонгогдлоо!');
    }
    
    // Мэссэж харуулах
    function showNotification(message) {
      const existingNotification = document.querySelector('.notification');
      if (existingNotification) {
        existingNotification.remove();
      }
      
      const notification = document.createElement('div');
      notification.className = 'notification';
      notification.textContent = message;
      notification.style.cssText = `
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #1f3c88;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        z-index: 10000;
        font-size: 14px;
        animation: slideIn 0.3s ease;
      `;
      
      document.body.appendChild(notification);
      
      setTimeout(() => {
        notification.style.animation = 'slideOut 0.3s ease';
        setTimeout(() => {
          notification.remove();
        }, 300);
      }, 2000);
    }
    
    // CSS animation нэмэх
    const style = document.createElement('style');
    style.textContent = `
      @keyframes slideIn {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes slideOut {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(100%); opacity: 0; }
      }
      
      /* Gradient режимд текстийн стил */
      .gradient-mode {
        color: #ffffff !important;
      }
      
      .gradient-mode h1,
      .gradient-mode h2,
      .gradient-mode h3,
      .gradient-mode p,
      .gradient-mode span,
      .gradient-mode div:not(.section):not(.skill):not(.hobby-item):not(.social-icon) {
        color: #ffffff !important;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.5) !important;
      }
      
      .gradient-mode .section h2,
      .gradient-mode .section p,
      .gradient-mode .section span:not(.skill):not(.hobby-item) {
        color: #ffffff !important;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.5) !important;
      }
    `;
    document.head.appendChild(style);
    
    // Хэрэглэгч ирэхэд өөрийн хэлээр мэссэж харуулах
    const browserLang = navigator.language || navigator.userLanguage;
    if (browserLang.startsWith('mn')) {
      setTimeout(() => {
        if (!localStorage.getItem('hasVisited')) {
          showNotification('Тавтай морил! Монгол хэлээр үзэж байна.');
        }
      }, 1000);
    } else {
      setTimeout(() => {
        if (!localStorage.getItem('hasVisited')) {
          showNotification('Welcome! Viewing in English.');
        }
      }, 1000);
    }
    
    // Фон өнгө сонгох товчнуудыг шалгах
    console.log('Фон өнгө сонгох товчнууд идэвхтэй байна.');
    
    // Фон өөрчлөх функц тест
    function testBackgroundFunction() {
      console.log('Testing background change function...');
      changeBackgroundColor('#f0f4f8', '#333');
      setTimeout(() => {
        changeBackgroundGradient('#667eea', '#764ba2');
      }, 1000);
    }
    
    // Автомат тест (optional)
    // setTimeout(testBackgroundFunction, 2000);
  </script>
</body>
</html>
